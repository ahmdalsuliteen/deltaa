<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة دلتا | DELTA Admin</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<section id="login" class="center"><form id="loginForm" class="box">
  <span class="logo"></span><h1>لوحة الإدارة</h1>
  <label>البريد الإلكتروني<input type="email" id="em" required autocomplete="username" dir="ltr"></label>
  <label>كلمة المرور<input type="password" id="pw" required autocomplete="current-password" dir="ltr"></label>
  <button class="btn" type="submit">دخول</button><p id="loginErr" class="msg err"></p>
</form></section>

<div id="app" hidden>
  <header><span class="logo"></span>
    <nav><button data-tab="content" class="on">المحتوى</button><button data-tab="subs">الطلبات</button></nav>
    <span class="grow"></span><a href="index.html" target="_blank" class="ghost">عرض الموقع</a><button id="out" class="ghost">خروج</button></header>
  <main>
    <section id="tab-content"><div id="editor"></div></section>
    <section id="tab-subs" hidden>
      <div class="bar"><input id="q" placeholder="بحث بالاسم أو الجوال أو البريد"><button class="btn" id="csv">تصدير CSV</button><span id="count"></span></div>
      <div class="scroll"><table><thead><tr><th>التاريخ</th><th>الاسم الأول</th><th>اسم العائلة</th><th>الجوال</th><th>البريد</th><th>اللغة</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </main>
  <div class="savebar"><span id="state">لا توجد تغييرات</span><button class="ghost" id="reset">استعادة الافتراضي</button><button class="btn" id="save">حفظ ونشر</button></div>
</div>
<script type="module" src="js/admin.js"></script>
</body></html>
